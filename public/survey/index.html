<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom — a 50-paper survey, running</title>
<meta name="description" content="examples/research as a 65-second run: 24 questions through the findings gate, 50 papers down to one executive abstract and a set of open questions.">
<meta name="color-scheme" content="light dark">
<style>
:root {
  --bg: #f1f3f4; --surface: #fafbfb; --ink: #10161a; --ink-2: #4d585f; --ink-3: #7f8c93;
  --line: rgba(16, 22, 26, 0.11); --line-2: rgba(16, 22, 26, 0.20);
  --accent: #06758f; --wash: rgba(6, 117, 143, 0.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1012; --surface: #131a1d; --ink: #edf3f5; --ink-2: #9dabb1; --ink-3: #6b787e;
    --line: rgba(237, 243, 245, 0.13); --line-2: rgba(237, 243, 245, 0.24);
    --accent: #6fd3f2; --wash: rgba(111, 211, 242, 0.10);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body {
  display: grid; grid-template-rows: minmax(0, 1fr) auto;
  font: 13px/1.4 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
canvas { display: block; width: 100%; height: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* The transport. Plain controls in the page's own type and tokens; nothing
   here previews on hover, so a cursor crossing the track never moves the
   run — only a press does. */
.bar {
  display: flex; align-items: center; gap: 16px;
  height: 52px; padding: 0 18px;
  border-top: 1px solid var(--line);
  color: var(--ink-3);
}
.bar button {
  flex: none; display: grid; place-items: center;
  height: 32px; min-width: 32px; padding: 0 8px;
  border: 1px solid var(--line-2); border-radius: 7px;
  background: transparent; color: var(--ink); font: inherit; cursor: pointer;
}
.bar button:hover { background: var(--surface); }
.bar button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--wash); }
.bar svg { width: 14px; height: 14px; fill: currentColor; }
.time { flex: none; font-variant-numeric: tabular-nums; }
.track {
  position: relative; flex: 1; height: 32px; cursor: pointer; touch-action: none;
}
.track .rail, .track .fill {
  position: absolute; left: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 2px;
}
.track .rail { right: 0; background: var(--line-2); }
.track .fill { width: 0; background: var(--accent); }
.track .tick { position: absolute; top: 50%; width: 1px; height: 9px; margin-top: -4.5px; background: var(--ink-3); opacity: 0.6; }
.track .knob {
  position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;
  border-radius: 50%; background: var(--accent);
}
.scene { flex: none; width: 10ch; color: var(--ink-2); }
.home { flex: none; color: var(--ink-3); text-decoration: none; }
.home:hover { color: var(--ink); }
@media (max-width: 640px) {
  .bar { gap: 10px; padding: 0 10px; }
  .scene, .home { display: none; }
}
</style>
</head>
<body>
<canvas role="img" aria-label="examples/research running: 24 research questions through the findings gate, 50 papers screened, graded and folded by two ReduceAI trees into an executive abstract and a set of open questions — 253 tasks, 6 retries, 3 escalations, 1 dead letter — then rerun entirely from cache with zero model calls."></canvas>

<div class="bar">
  <button class="pp" type="button" aria-label="Pause"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1.5" width="3.5" height="11" rx="1"/><rect x="8.5" y="1.5" width="3.5" height="11" rx="1"/></svg></button>
  <span class="time">0:00 / 1:06</span>
  <div class="track" role="slider" tabindex="0" aria-label="Position in the run" aria-valuemin="0" aria-valuemax="65.5" aria-valuenow="0">
    <div class="rail"></div><div class="fill"></div><div class="knob"></div>
  </div>
  <span class="scene">Ask</span>
  <button class="cc" type="button" aria-pressed="true" title="Captions (C)">CC</button>
  <a class="home" href="../">Loom&nbsp;↗</a>
</div>

<script type="module">
import { mountSurvey, STILL } from './survey.js';

const canvas = document.querySelector('canvas');
const pp = document.querySelector('.pp');
const cc = document.querySelector('.cc');
const track = document.querySelector('.track');
const fill = track.querySelector('.fill');
const knob = track.querySelector('.knob');
const time = document.querySelector('.time');
const scene = document.querySelector('.scene');

// A reader who asked for less motion gets the finished run, held, and a play
// button that starts it from the top.
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const player = mountSurvey(canvas, { autoplay: !still, captions: true, time: still ? STILL : 0 });
let fromStill = still;

for (const s of player.scenes) {
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.title = s.name;
  tick.style.left = (player.cues[s.name] / player.duration * 100) + '%';
  track.prepend(tick);
}

const PLAY = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.8v10.4a.8.8 0 0 0 1.2.7l8.4-5.2a.8.8 0 0 0 0-1.4L4.2 1.1A.8.8 0 0 0 3 1.8z"/></svg>';
const PAUSE = pp.innerHTML;
const clock = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
let wasPlaying = null;
player.on((p) => {
  const u = p.time / p.duration * 100;
  fill.style.width = u + '%';
  knob.style.left = u + '%';
  time.textContent = clock(p.time) + ' / ' + clock(Math.ceil(p.duration));
  scene.textContent = p.scenes[p.scene].name;
  track.setAttribute('aria-valuenow', p.time.toFixed(1));
  track.setAttribute('aria-valuetext', clock(p.time) + ', ' + p.scenes[p.scene].name);
  if (wasPlaying !== p.playing) {
    wasPlaying = p.playing;
    pp.innerHTML = p.playing ? PAUSE : PLAY;
    pp.setAttribute('aria-label', p.playing ? 'Pause' : 'Play');
  }
  cc.setAttribute('aria-pressed', String(p.captions));
});
player.seek(player.time);

const toggle = () => {
  if (fromStill && !player.playing) { fromStill = false; player.seek(0); }
  player.toggle();
};
pp.addEventListener('click', toggle);
cc.addEventListener('click', () => player.setCaptions(!player.captions));

// Scrubbing: press and drag. The run pauses under the finger and resumes on
// release if it was playing.
let resume = false;
const seekTo = (e) => {
  const r = track.getBoundingClientRect();
  fromStill = false;
  player.seek(Math.min(Math.max((e.clientX - r.left) / r.width, 0), 0.9999) * player.duration);
};
track.addEventListener('pointerdown', (e) => {
  resume = player.playing;
  player.pause();
  track.setPointerCapture(e.pointerId);
  seekTo(e);
});
track.addEventListener('pointermove', (e) => { if (track.hasPointerCapture(e.pointerId)) seekTo(e); });
const release = (e) => {
  if (!track.hasPointerCapture(e.pointerId)) return;
  track.releasePointerCapture(e.pointerId);
  if (resume) player.play();
};
track.addEventListener('pointerup', release);
track.addEventListener('pointercancel', release);

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = e.target instanceof HTMLButtonElement || e.target instanceof HTMLAnchorElement;
  const step = (d) => { fromStill = false; player.seek(Math.min(Math.max(player.time + d, 0), player.duration - 0.01)); };
  switch (e.key) {
    case ' ': case 'k': case 'K':
      if (onButton && e.key === ' ') return;
      e.preventDefault(); toggle(); break;
    case 'ArrowLeft': e.preventDefault(); step(-5); break;
    case 'ArrowRight': e.preventDefault(); step(5); break;
    case 'Home': e.preventDefault(); step(-player.duration); break;
    case 'c': case 'C': player.setCaptions(!player.captions); break;
  }
});
</script>
</body>
</html>
