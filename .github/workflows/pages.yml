# Publishes public/ to GitHub Pages.
#
# Pages can only serve from the repository root or docs/ when it builds from a
# branch, and public/ is neither — so the page is uploaded as a Pages artifact
# from Actions instead. This needs the repository's Pages source set to
# "GitHub Actions" (Settings → Pages → Build and deployment → Source).
#
# The site is static: no build step, nothing to install.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is mid-flight —
# a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page is intact
        run: |
          test -f public/index.html
          test -f public/woven-knot.html
          test -f public/knot-model.js
          test -f public/three-d-stage.js
          test -f public/survey/index.html
          test -f public/survey/survey.js
          test -f public/survey/survey-animation.dc.html

      # The run is one dependency-free module, so Node can import it and catch
      # what would otherwise only fail in a reader's browser: a scene table
      # that no longer adds up to the 65.5 seconds the camera is keyed to, a
      # cue the choreography uses that names no scene, counts that disagree
      # with the description screen readers are given, or a frame anywhere on
      # the timeline that throws. Every frame is a pure function of the time,
      # so drawing all of them into a stub context is the whole smoke test.
      - name: Check the run draws, end to end
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const m = await import(process.cwd() + '/public/survey/survey.js');
          const src = readFileSync('public/survey/survey.js', 'utf8');
          const page = readFileSync('public/index.html', 'utf8');
          const player = readFileSync('public/survey/index.html', 'utf8');
          const fail = (msg) => { console.log('::error::' + msg); process.exit(1); };

          if (m.SCENES.length !== 12) fail(`expected 12 scenes, found ${m.SCENES.length}`);
          if (Math.abs(m.DURATION - 65.5) > 1e-9) fail(`expected a 65.5s run, found ${m.DURATION}s`);
          const names = new Set(m.SCENES.map((s) => s.name));
          const missing = [...new Set([...src.matchAll(/\bC\.([A-Z]\w*)/g)].map((x) => x[1]))].filter((n) => !names.has(n));
          if (missing.length) fail(`choreography cues scenes the table does not name: ${missing}`);

          for (const [file, html] of [['index.html', page], ['survey/index.html', player]]) {
            if (!html.includes(`${m.COUNTS.tasks} tasks`)) fail(`${file} does not describe the run as ${m.COUNTS.tasks} tasks`);
          }
          if (!page.includes("import('./survey/survey.js')")) fail('index.html no longer loads survey/survey.js');
          if (!player.includes("from './survey.js'")) fail('survey/index.html no longer loads survey.js');

          const noop = () => {};
          const ctx = new Proxy({}, {
            get: (t, k) => k in t ? t[k]
              : k === 'measureText' ? (s) => ({ width: String(s).length * 11 })
              : k === 'createLinearGradient' ? () => ({ addColorStop: noop })
              : noop,
            set: (t, k, v) => { t[k] = v; return true; },
          });
          let frames = 0;
          for (const dark of [false, true]) {
            for (let T = 0; T <= m.DURATION; T += 1 / 30, frames++) {
              try { m.drawFrame(ctx, T, { width: 1920, height: 1080, dark, captions: true }); }
              catch (e) { fail(`frame at T=${T.toFixed(3)}s (${dark ? 'dark' : 'light'}) throws: ${e.message}`); }
            }
          }
          console.log(`${frames} frames drawn, ${m.SCENES.length} scenes, ${m.DURATION}s, ${m.COUNTS.tasks} tasks`);
          JS

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4

      # Checking files and stopping is a green run. That is exactly what this
      # workflow did between #23 and #24: the three publishing steps above had
      # been dropped, every run reported success, and the site stayed on the
      # build before them. A Pages run that publishes nothing must be red.
      - name: Confirm something was actually published
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$url" ]; then
            echo "::error::deploy-pages produced no page_url — nothing was published."
            exit 1
          fi
          echo "Published to $url"
