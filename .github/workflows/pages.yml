# Publishes public/ to GitHub Pages.
#
# Pages can only serve from the repository root or docs/ when it builds from a
# branch, and public/ is neither — so the page is uploaded as a Pages artifact
# from Actions instead. This needs the repository's Pages source set to
# "GitHub Actions" (Settings → Pages → Build and deployment → Source).
#
# The site is static: no build step, nothing to install.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is mid-flight —
# a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page is intact
        run: |
          test -f public/index.html
          test -f public/woven-knot.html
          test -f public/knot-model.js
          test -f public/three-d-stage.js
          test -f public/survey/survey-animation.dc.html
          test -f public/survey/support.js
          test -f public/survey/animations-v3.jsx
          test -f public/survey/tweaks-panel.jsx
          test -f public/survey/loom-survey-scene.jsx
          test -f public/survey/page-embed.jsx

      # The player mounts the page wrapper, the composition is cued against a
      # scene list that lives in the host page, and the frame's geometry is
      # built around the 44px the stage reserves for its transport. All three
      # are easy to lose in a re-copy from the design, and all three fail at
      # runtime rather than here.
      - name: Check the survey player is wired to its scenes
        run: |
          python3 - <<'PY'
          import json, re
          host = open('public/survey/survey-animation.dc.html').read()
          scene = open('public/survey/loom-survey-scene.jsx').read()
          engine = open('public/survey/animations-v3.jsx').read()
          page = open('public/index.html').read()

          assert 'component-from-global-scope="LoomSurveyPageEmbed"' in host, \
              'host page does not mount LoomSurveyPageEmbed'
          assert './page-embed.jsx' in host, 'host page does not import the wrapper'
          assert 'window.LoomSurveyEmbed' in open('public/survey/page-embed.jsx').read(), \
              'the wrapper no longer renders LoomSurveyEmbed'
          assert 'window.LoomSurveyEmbed = LoomSurveyEmbed' in scene, \
              'the scene file no longer exports LoomSurveyEmbed'

          scenes = json.loads(re.search(r"window\.OM_SCENES = '(.+?)';", host, re.S).group(1))
          assert len(scenes) == 12, f'expected 12 scenes, found {len(scenes)}'
          total = sum(s['dur'] for s in scenes)
          assert abs(total - 65.5) < 1e-9, f'expected a 65.5s composition, found {total}s'

          cued = set(re.findall(r'C\.(\w+)', scene))
          missing = cued - {s['name'] for s in scenes}
          assert not missing, f'choreography cues sections the scene list does not name: {sorted(missing)}'

          # The frame clips the transport away, and the hidden bar is pinned to
          # the same figure. If the engine ever reserves something other than
          # 44px, both go wrong together and silently.
          bar = re.search(r'const barH = (\d+);', engine)
          assert bar and bar.group(1) == '44', \
              f'the stage reserves {bar.group(1) if bar else "?"}px for its transport, not the 44 the frame is built around'
          assert 'calc(100% + 44px)' in page, 'index.html no longer sizes the iframe to canvas + 44px'
          assert 'height: 44px;' in host, 'the hidden transport is no longer pinned to 44px'
          PY
