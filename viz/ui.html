<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom · constellation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a10'/%3E%3Cpath d='M8 2 L9.2 6.8 L14 8 L9.2 9.2 L8 14 L6.8 9.2 L2 8 L6.8 6.8 Z' fill='%233987e5'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --surface: #0a0a10;
    --panel: #14141c;
    --hairline: rgba(255,255,255,.10);
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --c-pending: #898781;
    --c-running: #3987e5;
    --c-long: #fab219;
    --c-retry: #ec835a;
    --c-done: #0ca30c;
    --c-cached: #9085e9;
    --c-fail: #d03b3b;
    --c-shared: #2ab5a6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 20%, #10101a 0%, var(--surface) 55%, #07070c 100%);
    color: var(--ink-2);
    overflow: hidden;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #sky:focus-visible { box-shadow: inset 0 0 0 1px rgba(57,135,229,.45); }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 10px 18px;
    background: linear-gradient(rgba(7,7,12,.88), rgba(7,7,12,.55) 75%, transparent);
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .brand { font-size: 14px; letter-spacing: .22em; color: var(--ink); font-weight: 600; }
  .brand small { letter-spacing: .08em; color: var(--ink-3); font-weight: 400; margin-left: 8px; }
  #runMeta { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; flex-wrap: wrap; gap: 6px 0; }
  #runMeta .chip {
    display: inline-block; padding: 2px 8px; border: 1px solid var(--hairline);
    border-radius: 999px; margin-left: 8px; color: var(--ink-2);
  }
  #runMeta .chip.done { color: var(--c-done); border-color: rgba(12,163,12,.4); }
  #runMeta .chip.live { color: var(--c-running); border-color: rgba(57,135,229,.4); }
  #runMeta .chip.note { color: var(--c-long); border-color: rgba(250,178,25,.4); }
  #runMeta .chip.conn { color: var(--ink-3); border-color: var(--hairline); margin-left: 8px; }
  #runMeta .chip.conn.ok { color: var(--c-done); border-color: rgba(12,163,12,.35); }
  #runMeta .chip.conn.warn { color: var(--c-long); border-color: rgba(250,178,25,.4); }
  #runMeta .chip.conn.bad { color: var(--c-fail); border-color: rgba(208,59,59,.4); }
  #stats { display: flex; gap: 16px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .stat { text-align: right; min-width: 52px; }
  .stat b {
    display: block; font-size: 15px; color: var(--ink); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat span { font-size: 9.5px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
  .stat b .accent-fail { color: var(--c-fail); }

  #legend {
    position: fixed; left: 14px; bottom: 12px; z-index: 5;
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    font-size: 11px; color: var(--ink-2);
    background: rgba(10,10,16,.72); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 7px 12px; backdrop-filter: blur(4px);
  }
  #legend .li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #legend .ic { width: 14px; text-align: center; font-size: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }

  #tooltip {
    position: fixed; z-index: 8; pointer-events: none; display: none;
    background: rgba(14,14,22,.94); border: 1px solid var(--hairline); border-radius: 7px;
    padding: 5px 9px; font-size: 11.5px; color: var(--ink-2); max-width: 320px;
  }
  #tooltip b { color: var(--ink); font-weight: 600; }

  #empty {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 2; pointer-events: none; flex-direction: column; gap: 10px;
  }
  #empty h2 { color: var(--ink-3); font-weight: 400; font-size: 15px; letter-spacing: .06em; }
  #empty code { font-size: 12px; color: #5c5c66; }

  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 92vw; z-index: 6;
    background: rgba(20,20,28,.96); border-left: 1px solid var(--hairline);
    transform: translateX(105%); transition: transform .18s ease-out;
    display: flex; flex-direction: column; backdrop-filter: blur(6px);
  }
  #panel.open { transform: translateX(0); }
  #panel .head {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--hairline);
    display: flex; align-items: baseline; gap: 10px;
  }
  #panel .head h3 {
    font-size: 13px; color: var(--ink); font-weight: 600; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #panel .head .x {
    margin-left: auto; cursor: pointer; border: 0; background: none; color: var(--ink-3);
    font-size: 16px; padding: 2px 6px; border-radius: 6px; line-height: 1;
  }
  #panel .head .x:hover { color: var(--ink); background: rgba(255,255,255,.06); }
  #panel .head .x:focus-visible { outline: 1px solid var(--c-running); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    #panel { transition: none; }
  }
  @media (max-width: 720px) {
    #stats { gap: 10px; }
    .stat { min-width: 44px; }
    #legend { left: 8px; right: 8px; bottom: 8px; gap: 10px; font-size: 10.5px; }
  }
  #panel .body { overflow-y: auto; padding: 10px 16px 20px; font-size: 12.5px; }
  .status-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 10px; color: var(--ink);
  }
  .kv { display: grid; grid-template-columns: 108px 1fr; gap: 4px 10px; margin: 12px 0; }
  .kv dt { color: var(--ink-3); }
  .kv dd { color: var(--ink-2); font-variant-numeric: tabular-nums; word-break: break-word; }
  .kv dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  #panel h4 {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); margin: 16px 0 6px;
  }
  #panel pre {
    background: rgba(0,0,0,.35); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 9px 11px; font-size: 11px; line-height: 1.5; white-space: pre-wrap;
    word-break: break-word; color: var(--ink-2); max-height: 42vh; overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #panel pre.err { border-color: rgba(208,59,59,.5); color: #f0b3b3; }
  #panel details { margin: 6px 0; }
  #panel details summary {
    cursor: pointer; font-size: 11px; color: var(--ink-2); padding: 5px 8px;
    border: 1px solid var(--hairline); border-radius: 7px; user-select: none;
    list-style-position: inside;
  }
  #panel details summary:hover { background: rgba(255,255,255,.05); }
  #panel details[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  #panel details > pre, #panel details .call-body {
    border-top-left-radius: 0; border-top-right-radius: 0; margin-top: -1px;
  }
  #panel .call-body { border: 1px solid var(--hairline); border-radius: 0 0 8px 8px; padding: 8px; }
  #panel .call-body .cl { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); margin: 6px 0 3px; }
  #panel .call-body .cl:first-child { margin-top: 0; }
  #panel .call-body pre { max-height: 30vh; }
  #panel .lineage { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 8px; }
  #panel .lineage .none { color: var(--ink-3); font-size: 11.5px; }
  #panel .log { list-style: none; padding: 0; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; }
  #panel .log li {
    display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,.05);
    line-height: 1.45;
  }
  #panel .log .t { color: var(--ink-3); flex: 0 0 58px; text-align: right; font-variant-numeric: tabular-nums; }
  #panel .jump {
    background: none; border: 1px solid var(--hairline); border-radius: 6px; color: var(--c-running);
    font: inherit; cursor: pointer; padding: 1px 7px;
  }
  #panel .jump:hover { background: rgba(57,135,229,.12); }

  /* run summary overlay: the whole run on one card — steps, shared values,
     executors — opened with `s`, the header button, or automatically once
     when the run completes. */
  #summary {
    position: fixed; inset: 0; z-index: 9; display: none;
    align-items: flex-start; justify-content: center;
    background: rgba(5,5,9,.66); backdrop-filter: blur(3px);
    overflow-y: auto; padding: 7vh 16px 48px;
  }
  #summary.open { display: flex; }
  #summary .card {
    background: rgba(18,18,26,.97); border: 1px solid var(--hairline);
    border-radius: 14px; width: 780px; max-width: 96vw; padding: 16px 22px 22px;
  }
  #summary .card .head {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 10px; border-bottom: 1px solid var(--hairline);
  }
  #summary .card .head h3 {
    font-size: 12px; color: var(--ink); letter-spacing: .18em;
    text-transform: uppercase; font-weight: 600;
  }
  #summary .card .head .rid {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--ink-3); word-break: break-all;
  }
  #summary .card .head .x {
    margin-left: auto; cursor: pointer; border: 0; background: none; color: var(--ink-3);
    font-size: 16px; padding: 2px 6px; border-radius: 6px; line-height: 1;
  }
  #summary .card .head .x:hover { color: var(--ink); background: rgba(255,255,255,.06); }
  #summary .card .head .x:focus-visible { outline: 1px solid var(--c-running); outline-offset: 2px; }
  #summary h4 {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); margin: 18px 0 8px;
  }
  #summary .totals { display: flex; gap: 26px; flex-wrap: wrap; margin: 14px 0 2px; }
  #summary .totals .stat { text-align: left; min-width: 0; }
  #summary table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  #summary th {
    text-align: right; font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 500; padding: 2px 8px; white-space: nowrap;
  }
  #summary td {
    text-align: right; padding: 4px 8px; border-top: 1px dashed rgba(255,255,255,.07);
    color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #summary th:first-child, #summary td:first-child { text-align: left; padding-left: 0; }
  #summary th:last-child, #summary td:last-child { padding-right: 0; }
  #summary td .jump { font-size: 11px; }
  #summary .note { color: var(--ink-3); font-size: 11px; margin-top: 8px; line-height: 1.5; }
  #summary .save { color: var(--c-shared); }
  #runMeta .chip.btn { cursor: pointer; background: none; font: inherit; font-size: 11px; }
  #runMeta .chip.btn:hover { color: var(--ink); border-color: rgba(255,255,255,.3); }
</style>
</head>
<body>
<canvas id="sky" tabindex="0" role="img" aria-label="Loom constellation — live run visualization"></canvas>

<header>
  <div class="brand">LOOM<small>constellation</small></div>
  <div id="runMeta">waiting for a run…</div>
  <div id="stats"></div>
</header>

<div id="empty">
  <h2>Listening for a Loom run</h2>
  <code>loom.Run(ctx, p, loom.WithEventHandler(viz.Handle), …)</code>
</div>

<div id="legend">
  <span class="li"><span class="ic"><span class="dot" style="background:var(--c-pending);opacity:.5"></span></span>queued</span>
  <span class="li"><span class="ic"><span class="dot" style="background:var(--c-running);box-shadow:0 0 6px var(--c-running)"></span></span>running</span>
  <span class="li"><span class="ic"><span class="dot" style="background:var(--c-running);box-shadow:0 0 0 2.5px rgba(10,10,16,1),0 0 0 3.5px var(--c-long)"></span></span>long-running</span>
  <span class="li"><span class="ic" style="color:var(--c-retry)">↻</span>retrying</span>
  <span class="li"><span class="ic" style="color:var(--c-done)">✦</span>completed</span>
  <span class="li"><span class="ic" style="color:var(--c-cached)">✧</span>cache replay</span>
  <span class="li"><span class="ic" style="color:var(--c-fail)">✕</span>failed</span>
  <span class="li"><span class="ic" style="color:var(--c-running)">◇</span>executor</span>
  <span class="li"><span class="ic" style="color:var(--c-shared)">⬡</span>shared value</span>
  <span class="li" style="color:var(--ink-3)"><span class="ic">ⓘ</span>click · ←→ tasks · f failed · e executors · b shared · s summary · esc</span>
</div>

<div id="tooltip"></div>

<aside id="panel" role="complementary" aria-label="Inspector">
  <div class="head">
    <h3 id="panelTitle"></h3>
    <button type="button" class="x" id="panelClose" title="close (esc)" aria-label="Close inspector">✕</button>
  </div>
  <div class="body" id="panelBody"></div>
</aside>

<div id="summary" role="dialog" aria-modal="true" aria-label="Run summary">
  <div class="card">
    <div class="head">
      <h3>run summary</h3>
      <span class="rid" id="summaryRun"></span>
      <button type="button" class="x" id="summaryClose" title="close (esc)" aria-label="Close summary">✕</button>
    </div>
    <div id="summaryBody"></div>
  </div>
</div>

<script>
'use strict';

// ---------------------------------------------------------------- state ----
const COLORS = {
  pending: '#898781', running: '#3987e5', long: '#fab219',
  retry: '#ec835a', done: '#0ca30c', cached: '#9085e9', fail: '#d03b3b',
  shared: '#2ab5a6',
};
const S = {
  run: { runId: '', startedAt: 0, endedAt: 0, done: false, note: '' },
  stages: [], stageIx: new Map(),
  tasks: [], taskIx: new Map(),
  workers: [], workerIx: new Map(),
  broadcasts: [], broadcastIx: new Map(),
  offset: 0,          // Date.now() - server time
  layoutDirty: true,
  thresholdsDirty: true,
  lineageDirty: true,
  stageStatsDirty: true,
};
let selected = null;  // {type:'task'|'worker'|'stage', id}
let hovered = null;           // task or worker object under the cursor
let hoveredStage = null;      // stage object whose label is under the cursor
let hoveredBroadcast = null;  // shared-value node under the cursor
let connState = 'connecting'; // connecting | live | reconnecting
let lastPanelKey = '';
let lastPanelHTML = '';
let chromeDirty = true;  // header stats need a rebuild
let panelDirty = false;  // open inspector needs a rebuild
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const serverNow = () => Date.now() - S.offset;

function upsert(list, ix, item) {
  const cur = ix.get(item.id);
  if (cur) { Object.assign(cur, item); return cur; }
  ix.set(item.id, item);
  list.push(item);
  S.layoutDirty = true;
  return item;
}

function clearState() {
  S.stages = []; S.stageIx = new Map();
  S.tasks = []; S.taskIx = new Map();
  S.workers = []; S.workerIx = new Map();
  S.broadcasts = []; S.broadcastIx = new Map();
  detailCache.clear();
  S.layoutDirty = true; S.thresholdsDirty = true; S.lineageDirty = true; S.stageStatsDirty = true;
  chromeDirty = true;
}

function selectionStillValid(sel) {
  if (!sel) return false;
  if (sel.type === 'task') return S.taskIx.has(sel.id);
  if (sel.type === 'worker') return S.workerIx.has(sel.id);
  if (sel.type === 'stage') return S.stageIx.has(sel.id);
  if (sel.type === 'broadcast') return S.broadcastIx.has(sel.id);
  return false;
}

function dropSelection() {
  if (!selected) return;
  selected = null;
  lastPanelKey = '';
  lastPanelHTML = '';
  closePanel();
}

function applySnapshot(snap) {
  const keep = selected;
  S.offset = Date.now() - snap.now;
  clearState();
  S.run = { runId: snap.runId || '', startedAt: snap.startedAt || 0, endedAt: snap.endedAt || 0,
            done: !!snap.done, note: snap.note || '', driver: snap.driver || '' };
  (snap.stages || []).forEach(st => upsert(S.stages, S.stageIx, st));
  (snap.tasks || []).forEach(t => upsert(S.tasks, S.taskIx, t));
  (snap.workers || []).forEach(w => upsert(S.workers, S.workerIx, w));
  (snap.broadcasts || []).forEach(b => upsert(S.broadcasts, S.broadcastIx, b));
  if (keep && !selectionStillValid(keep)) dropSelection();
  refreshChrome();
  if (selected && panel.classList.contains('open')) renderPanel();
}

function applyDelta(d) {
  S.offset = Date.now() - d.now;
  if (d.reset) {
    clearState();
    dropSelection();
    closeSummary();
  }
  const wasDone = S.run.done;
  if (d.run) S.run = { runId: d.run.runId || '', startedAt: d.run.startedAt || 0,
                       endedAt: d.run.endedAt || 0, done: !!d.run.done, note: d.run.note || '',
                       driver: d.run.driver || '' };
  // Watched the run finish live → surface the summary once, after the
  // completion flash has had its moment. Reconnecting to an already-done
  // run (snapshots) never auto-opens.
  if (!wasDone && S.run.done && S.run.runId) scheduleAutoSummary();
  if (d.stage) upsert(S.stages, S.stageIx, d.stage);
  if (d.task) {
    const t = upsert(S.tasks, S.taskIx, d.task);
    // Lineage is derived from record IDs, and only two events carry them.
    // Recomputing it on every status change meant rebuilding the whole
    // graph on every event of the run.
    if (d.task.inputIds || d.task.outputIds) S.lineageDirty = true;
    S.stageStatsDirty = true;
    if (t.status === 'completed' || t.status === 'failed') S.thresholdsDirty = true;
  }
  if (d.worker) upsert(S.workers, S.workerIx, d.worker);
  if (d.broadcast) upsert(S.broadcasts, S.broadcastIx, d.broadcast);
  // The chrome and the inspector are DOM, and rebuilding them per event is
  // what turns a fast run into a stalled tab. Mark them dirty and let the
  // display tick coalesce: the canvas stays live at frame rate regardless,
  // so nothing the eye tracks is delayed.
  chromeDirty = true;
  panelDirty = true;
}

function parseSSE(raw) {
  try { return JSON.parse(raw); }
  catch (err) { console.warn('viz: bad SSE payload', err); return null; }
}

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('snapshot', e => {
    const snap = parseSSE(e.data);
    if (!snap) return;
    connState = 'live';
    applySnapshot(snap);
  });
  es.addEventListener('delta', e => {
    const d = parseSSE(e.data);
    if (!d) return;
    connState = 'live';
    applyDelta(d);
  });
  es.onopen = () => { connState = 'live'; refreshChrome(); };
  es.onerror = () => { connState = 'reconnecting'; refreshChrome(); };
  // EventSource reconnects automatically; each reconnect replays a snapshot.
}
connect();

// --------------------------------------------------------------- layout ----
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, specks = [];
const labelRects = []; // clickable stage-label hit boxes, rebuilt each frame

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  specks = [];
  const n = Math.min(420, Math.round((W * H) / 8500));
  let seed = 42;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    specks.push({ x: rnd() * W, y: rnd() * H, r: .4 + rnd() * .9,
                  phase: rnd() * 6.28, speed: .0004 + rnd() * .0012, base: .12 + rnd() * .22 });
  }
  S.layoutDirty = true;
}
window.addEventListener('resize', resize);
resize();

function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}

const GOLDEN = 2.39996322973;
function computeLayout() {
  const panelOpen = typeof panel !== 'undefined' && panel.classList.contains('open');
  // On narrow viewports the inspector covers most of the sky; keep the full
  // layout underneath rather than crushing the constellation into a sliver.
  const panelW = panelOpen && W >= 720 ? Math.min(380, W * 0.92) : 0;
  const mX = 100, mR = 100 + panelW, top = 88, beltH = 110;
  const usableW = Math.max(160, W - mX - mR), midY = top + (H - top - beltH) * 0.5;
  const counts = new Map();
  S.tasks.forEach(t => counts.set(t.stage, (counts.get(t.stage) || 0) + 1));

  // Only stages with tasks get a cluster; sources and empty stages stay off
  // the sky (edges reroute to the nearest visible upstream ancestor).
  const visible = S.stages.filter(st => counts.get(st.id));
  const k = Math.max(visible.length, 1);
  S.stages.forEach(st => { st._cx = undefined; });
  visible.forEach((st, i) => {
    const fx = (i + 0.5) / k;
    st._cx = mX + usableW * fx;
    st._cy = midY - Math.sin(Math.PI * fx) * (H * 0.07)
           + ((hash(st.id) % 100) / 100 - 0.5) * (H * 0.10);
    st._rMax = Math.max(34, Math.min(usableW / k * 0.40, (H - top - beltH) * 0.30));
  });

  const idxIn = new Map();
  S.tasks.forEach(t => {
    const st = S.stageIx.get(t.stage);
    const i = idxIn.get(t.stage) || 0;
    idxIn.set(t.stage, i + 1);
    if (!st || st._cx === undefined) { t._tx = mX + usableW / 2; t._ty = midY; return; }
    const count = counts.get(t.stage) || 1;
    const r = st._rMax * Math.sqrt((i + 0.65) / Math.max(count, 7));
    const th = i * GOLDEN + (hash(t.stage) % 628) / 100;
    t._tx = st._cx + r * Math.cos(th);
    t._ty = st._cy + r * Math.sin(th) * 0.86;
    if (t._x === undefined) { t._x = t._tx; t._y = t._ty; }
  });

  // Shared values sit in their own band above the stage clusters: they are
  // not tasks and belong to no cluster, and the run reads *down* from them.
  const bn = S.broadcasts.length;
  S.broadcasts.forEach((b, i) => {
    b._tx = mX + usableW * ((i + 0.5) / Math.max(bn, 1));
    b._ty = top + 16;
    if (b._x === undefined) { b._x = b._tx; b._y = b._ty; }
  });

  const wk = S.workers.length;
  const workerSpan = Math.min(48, Math.max(28, usableW / Math.max(wk, 1)));
  S.workers.forEach((w, i) => {
    w._tx = mX + usableW / 2 + (i - (wk - 1) / 2) * workerSpan;
    w._ty = H - 62;
    if (w._x === undefined) { w._x = w._tx; w._y = w._ty; }
  });
  S.layoutDirty = false;
}

// Adaptive "long-running" threshold: 2.5× the stage's median completed
// runtime once three tasks have finished, else 8s; never below 4s.
const DEFAULT_LONG = 8000;
function computeThresholds() {
  const durs = new Map();
  S.tasks.forEach(t => {
    if (t.status === 'completed' && t.startedAt && t.endedAt) {
      if (!durs.has(t.stage)) durs.set(t.stage, []);
      durs.get(t.stage).push(t.endedAt - t.startedAt);
    }
  });
  S.stages.forEach(st => {
    const d = (durs.get(st.id) || []).sort((a, b) => a - b);
    st._long = d.length >= 3 ? Math.max(4000, 2.5 * d[Math.floor(d.length / 2)]) : DEFAULT_LONG;
  });
  S.thresholdsDirty = false;
}

// Lineage: which tasks produced the records each task consumed ("merged
// from"), and which tasks consumed its outputs ("feeds into"). Record IDs
// are the currency: pure/infer stages preserve them, reduce mints fresh
// ones, so a producer is found either in the same stage (reduce-tree
// levels) or up the upstream chain.
let fedBy = new Map(), feeds = new Map(); // taskId -> [taskId]
function computeLineage() {
  const prod = new Map(); // stage -> Map(recordId -> producing taskId)
  for (const t of S.tasks) {
    if (!t.outputIds) continue;
    let m = prod.get(t.stage);
    if (!m) { m = new Map(); prod.set(t.stage, m); }
    for (const rid of t.outputIds) m.set(rid, t.id);
  }
  fedBy = new Map(); feeds = new Map();
  for (const t of S.tasks) {
    const srcs = new Set();
    const same = prod.get(t.stage);
    for (const rid of (t.inputIds || [])) {
      let p = same && same.get(rid);
      if (p === t.id) p = null; // its own echo (per-record stages keep IDs)
      if (!p) {
        let st = S.stageIx.get(t.stage);
        let up = st && st.upstream && S.stageIx.get(st.upstream);
        while (up && !p) {
          const m = prod.get(up.id);
          p = m && m.get(rid);
          up = up.upstream && S.stageIx.get(up.upstream);
        }
      }
      if (p && p !== t.id) srcs.add(p);
    }
    const list = [...srcs];
    fedBy.set(t.id, list);
    for (const p of list) {
      if (!feeds.has(p)) feeds.set(p, []);
      feeds.get(p).push(t.id);
    }
  }
  S.lineageDirty = false;
}
function lineageOf(taskId) {
  if (S.lineageDirty) computeLineage();
  return { from: fedBy.get(taskId) || [], to: feeds.get(taskId) || [] };
}

let stageStats = new Map(); // id -> {total, settled}
function computeStageStats() {
  stageStats = new Map();
  for (const t of S.tasks) {
    let s = stageStats.get(t.stage);
    if (!s) { s = { total: 0, settled: 0 }; stageStats.set(t.stage, s); }
    s.total++;
    if (t.status === 'completed' || t.status === 'failed') s.settled++;
  }
  S.stageStatsDirty = false;
}

// Soft camera pan so a focused star isn't lost under the inspector / edges.
let camX = 0, camY = 0;

// ------------------------------------------------------------- painting ----
// A glow is a radial gradient, and building one per node per frame was the
// single most expensive thing this view did: thousands of gradient objects
// created and thrown away every frame. Each colour is instead rendered once
// into an offscreen sprite and then blitted, which is a plain textured draw
// no matter how many stars are on screen.
const glowSprites = new Map();
const GLOW_TEX = 64; // sprite radius in texels; scaled per draw

function glowSprite(color) {
  let sprite = glowSprites.get(color);
  if (sprite) return sprite;
  sprite = document.createElement('canvas');
  sprite.width = sprite.height = GLOW_TEX * 2;
  const sctx = sprite.getContext('2d');
  const g = sctx.createRadialGradient(GLOW_TEX, GLOW_TEX, 0, GLOW_TEX, GLOW_TEX, GLOW_TEX);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = g;
  sctx.fillRect(0, 0, GLOW_TEX * 2, GLOW_TEX * 2);
  glowSprites.set(color, sprite);
  return sprite;
}

function glow(x, y, r, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

function line(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function sparkle(x, y, s, color, alpha, hollow) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineWidth = 1.5;
  line(x - s, y, x + s, y); line(x, y - s, x, y + s);
  ctx.lineWidth = 0.8;
  const d = s * 0.45;
  line(x - d, y - d, x + d, y + d); line(x - d, y + d, x + d, y - d);
  if (hollow) {
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(x, y, s * 0.42, 0, 6.2832); ctx.stroke();
  } else {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, s * 0.34, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function cross(x, y, s, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineWidth = 2;
  line(x - s, y - s, x + s, y + s);
  line(x - s, y + s, x + s, y - s);
  ctx.globalAlpha = 1;
}

// lod: in a large run most stars are settled and identical frame to frame.
// They still have to be drawn, but they do not have to twinkle — dropping
// the glow and sparkle for them keeps the frame budget for the handful of
// nodes that are actually doing something.
function drawTask(t, now, tms, lod) {
  const x = t._x, y = t._y;
  const ph = (hash(t.id) % 628) / 100;
  const pulseAmt = reduceMotion ? 0 : 1;
  switch (t.status) {
    case 'pending': {
      ctx.globalAlpha = .38;
      ctx.fillStyle = COLORS.pending;
      ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      break;
    }
    case 'running': {
      const st = S.stageIx.get(t.stage);
      const longAfter = (st && st._long) || DEFAULT_LONG;
      const elapsed = t.startedAt ? now - t.startedAt : 0;
      const L = Math.max(0, Math.min(1, (elapsed - longAfter) / (longAfter * 1.2)));
      const pulse = .5 + .5 * Math.sin(tms / 320 + ph) * pulseAmt;
      glow(x, y, 11 + 4 * pulse + 14 * L, COLORS.running, .34 + .18 * pulse + .22 * L);
      ctx.fillStyle = '#eaf2ff';
      ctx.beginPath(); ctx.arc(x, y, 2.6 + .7 * pulse + 1.6 * L, 0, 6.2832); ctx.fill();
      if (L > 0) { // activity ring: this task is taking too long
        ctx.globalAlpha = .45 + .45 * L;
        ctx.strokeStyle = COLORS.long;
        ctx.lineWidth = 1.4;
        ctx.setLineDash([4, 5]);
        ctx.lineDashOffset = reduceMotion ? 0 : -(tms / 45) % 9;
        ctx.beginPath(); ctx.arc(x, y, 8.5 + 5 * L, 0, 6.2832); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }
      break;
    }
    case 'retrying': {
      const pulse = .5 + .5 * Math.sin(tms / 150 + ph) * pulseAmt;
      glow(x, y, 10 + 4 * pulse, COLORS.retry, .35 + .2 * pulse);
      ctx.fillStyle = COLORS.retry;
      ctx.beginPath(); ctx.arc(x, y, 2.6 + .6 * pulse, 0, 6.2832); ctx.fill();
      // one orbiting tick per failed attempt (capped)
      const ticks = Math.min(t.retries || 1, 5);
      ctx.fillStyle = COLORS.retry;
      for (let i = 0; i < ticks; i++) {
        const a = (reduceMotion ? i * 6.2832 / ticks : tms / 400 + i * 6.2832 / ticks);
        ctx.globalAlpha = .8;
        ctx.beginPath(); ctx.arc(x + 8 * Math.cos(a), y + 8 * Math.sin(a), 1.1, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'completed': {
      const color = t.cacheHit ? COLORS.cached : COLORS.done;
      const age = now - (t.endedAt || now);
      if (!reduceMotion && age < 650 && age >= 0) { // completion flash, then settle
        const f = age / 650;
        glow(x, y, 8 + 20 * f, color, (1 - f) * .55);
        ctx.globalAlpha = (1 - f) * .85;
        ctx.strokeStyle = color; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(x, y, 3 + 20 * f, 0, 6.2832); ctx.stroke();
        ctx.globalAlpha = 1;
        sparkle(x, y, 5.5 - 1.5 * f, color, 1, t.cacheHit);
      } else if (lod) {
        // settled and past its flash: a plain star, no per-frame maths
        ctx.globalAlpha = .9;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, 1.9, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        const tw = reduceMotion ? 1 : (.8 + .2 * Math.sin(tms / 900 + ph));
        glow(x, y, 6, color, .22 * tw);
        sparkle(x, y, 4, color, tw, t.cacheHit);
      }
      break;
    }
    case 'failed': {
      const ember = reduceMotion ? .9 : (.82 + .1 * Math.sin(tms / 1100 + ph));
      glow(x, y, 9, COLORS.fail, .30 * ember);
      cross(x, y, 4, COLORS.fail, ember);
      ctx.globalAlpha = .5;
      ctx.strokeStyle = COLORS.fail; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
      break;
    }
  }
}

function drawWorker(w, tms) {
  const x = w._x, y = w._y, s = 6;
  const busy = !!w.current;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(Math.PI / 4);
  if (busy) {
    glow(0, 0, 14, COLORS.running, .4);
    ctx.fillStyle = COLORS.running;
    ctx.globalAlpha = .95;
    ctx.fillRect(-s, -s, 2 * s, 2 * s);
  } else {
    ctx.strokeStyle = COLORS.pending;
    ctx.globalAlpha = .55;
    ctx.lineWidth = 1.2;
    ctx.strokeRect(-s, -s, 2 * s, 2 * s);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.fillStyle = busy ? '#c3c2b7' : '#5f5e58';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(w.id, x, y + 21);
}

// A shared value: a hexagonal node in its own hue, distinct from the circular
// task stars and diamond executors, with a dashed feed drawn down to every
// stage cluster observed reading it. The dashes drift toward the consumer so
// the direction of sharing is legible at a glance.
function drawBroadcast(b, tms, focusName) {
  const lit = focusName === b.id;
  const x = b._x, y = b._y;

  for (const sid of (b.stages || [])) {
    const st = S.stageIx.get(sid);
    if (!st || st._cx === undefined) continue;
    ctx.save();
    ctx.strokeStyle = COLORS.shared;
    ctx.globalAlpha = lit ? 0.55 : 0.16;
    ctx.lineWidth = lit ? 1.4 : 1;
    ctx.setLineDash([4, 8]);
    ctx.lineDashOffset = reduceMotion ? 0 : -(tms / 90) % 12;
    ctx.beginPath();
    ctx.moveTo(x, y + 9);
    ctx.quadraticCurveTo((x + st._cx) / 2, (y + st._cy) / 2 - 18, st._cx, st._cy - st._rMax * 0.55);
    ctx.stroke();
    ctx.restore();
  }

  const r = 7;
  if (lit) glow(x, y, 26, COLORS.shared, 0.30);
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.strokeStyle = COLORS.shared;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = lit ? 1 : 0.85;
  ctx.stroke();
  ctx.fillStyle = COLORS.shared;
  ctx.globalAlpha = lit ? 0.42 : 0.20;
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.font = '10px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = COLORS.shared;
  ctx.globalAlpha = lit ? 1 : 0.72;
  ctx.fillText(b.id, x, y - 13);
  if (b.readers) {
    ctx.globalAlpha = lit ? 0.85 : 0.5;
    ctx.fillStyle = '#c3c2b7';
    ctx.fillText(`${b.readers} reader${b.readers === 1 ? '' : 's'}`, x, y + 21);
  }
  ctx.restore();
}

function draw(tms) {
  if (S.layoutDirty) computeLayout();
  if (S.thresholdsDirty) computeThresholds();
  if (S.stageStatsDirty) computeStageStats();
  const now = serverNow();
  const taskN = S.tasks.length;
  const heavy = taskN >= 400;
  const lod = taskN >= 1500;
  const panelOpen = panel.classList.contains('open');
  const panelW = panelOpen && W >= 720 ? Math.min(380, W * 0.92) : 0;

  ctx.clearRect(0, 0, W, H);

  // background starfield (screen-space; not panned)
  ctx.fillStyle = '#cdd3e8';
  const speckStep = heavy ? 2 : 1;
  for (let i = 0; i < specks.length; i += speckStep) {
    const sp = specks[i];
    ctx.globalAlpha = reduceMotion ? sp.base
      : sp.base + Math.sin(tms * sp.speed + sp.phase) * sp.base * .8;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ease nodes toward layout targets
  for (const t of S.tasks) { t._x += (t._tx - t._x) * .15; t._y += (t._ty - t._y) * .15; }
  for (const w of S.workers) { w._x += (w._tx - w._x) * .2; w._y += (w._ty - w._y) * .2; }
  for (const b of S.broadcasts) { b._x += (b._tx - b._x) * .2; b._y += (b._ty - b._y) * .2; }

  // soft pan toward the focused node if it sits outside the visible sky
  const focusObj = (selected && (selected.type === 'task' ? S.taskIx.get(selected.id)
                    : selected.type === 'worker' ? S.workerIx.get(selected.id) : null))
                 || hovered || null;
  let wantX = 0, wantY = 0;
  if (focusObj && focusObj._x != null) {
    const left = 48, right = W - panelW - 48, top = 72, bottom = H - 88;
    if (focusObj._x > right) wantX = right - focusObj._x;
    else if (focusObj._x < left) wantX = left - focusObj._x;
    if (focusObj._y > bottom) wantY = bottom - focusObj._y;
    else if (focusObj._y < top) wantY = top - focusObj._y;
  }
  camX += (wantX - camX) * (reduceMotion ? 1 : 0.14);
  camY += (wantY - camY) * (reduceMotion ? 1 : 0.14);
  if (Math.abs(camX) < 0.05) camX = 0;
  if (Math.abs(camY) < 0.05) camY = 0;

  ctx.save();
  ctx.translate(camX, camY);

  // stage-to-stage constellation edges
  ctx.strokeStyle = 'rgba(140,160,220,.14)';
  ctx.lineWidth = 1;
  for (const st of S.stages) {
    if (st._cx === undefined) continue;
    let up = st.upstream && S.stageIx.get(st.upstream);
    while (up && up._cx === undefined) up = up.upstream && S.stageIx.get(up.upstream);
    if (!up) continue;
    ctx.beginPath();
    ctx.moveTo(up._cx, up._cy);
    ctx.quadraticCurveTo((up._cx + st._cx) / 2, Math.min(up._cy, st._cy) - 34, st._cx, st._cy);
    ctx.stroke();
  }

  // intra-cluster web (skip on large runs)
  if (taskN < 400) {
    const perStage = new Map();
    for (const t of S.tasks) {
      const prev = perStage.get(t.stage);
      if (prev) {
        ctx.strokeStyle = 'rgba(140,160,220,.06)';
        line(prev._x, prev._y, t._x, t._y);
      }
      perStage.set(t.stage, t);
    }
  }

  // executor → task links
  for (const w of S.workers) {
    if (!w.current) continue;
    const t = S.taskIx.get(w.current);
    if (!t) continue;
    ctx.strokeStyle = 'rgba(57,135,229,.30)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.lineDashOffset = reduceMotion ? 0 : -(tms / 30) % 9;
    line(w._x, w._y - 8, t._x, t._y);
    ctx.setLineDash([]);
  }

  // lineage edges for the focused task
  const focusTask = (selected && selected.type === 'task' && S.taskIx.get(selected.id)) ||
                    (hovered && S.taskIx.get(hovered.id) === hovered && hovered) || null;
  if (focusTask) {
    const strong = selected && selected.type === 'task' && selected.id === focusTask.id;
    const lin = lineageOf(focusTask.id);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = `rgba(143,184,255,${strong ? .55 : .3})`;
    for (const pid of lin.from) {
      const p = S.taskIx.get(pid);
      if (p) line(p._x, p._y, focusTask._x, focusTask._y);
    }
    ctx.strokeStyle = `rgba(143,184,255,${strong ? .35 : .18})`;
    ctx.setLineDash([2, 4]);
    for (const cid of lin.to) {
      const c = S.taskIx.get(cid);
      if (c) line(focusTask._x, focusTask._y, c._x, c._y);
    }
    ctx.setLineDash([]);
  }

  // stage labels
  labelRects.length = 0;
  ctx.textAlign = 'center';
  ctx.font = '11px system-ui, sans-serif';
  for (const st of S.stages) {
    if (st._cx === undefined) continue;
    const stats = stageStats.get(st.id) || { total: 0, settled: 0 };
    const label = `${st.id}  ${stats.settled}/${stats.total} ⓘ`;
    const lx = st._cx, ly = st._cy + st._rMax + 18;
    const active = hoveredStage === st || (selected && selected.type === 'stage' && selected.id === st.id);
    ctx.fillStyle = active ? '#c3c2b7' : (st.status === 'done' ? '#5f5e58' : '#898781');
    ctx.fillText(label, lx, ly);
    const w = ctx.measureText(label).width;
    labelRects.push({ x: lx - w / 2 - 5, y: ly - 12, w: w + 10, h: 17, stage: st });
  }

  if (selected && selected.type === 'stage') {
    const st = S.stageIx.get(selected.id);
    if (st && st._cx !== undefined) {
      ctx.globalAlpha = .4;
      ctx.strokeStyle = '#c3c2b7';
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 7]);
      ctx.lineDashOffset = reduceMotion ? 0 : -(tms / 160) % 12;
      ctx.beginPath(); ctx.arc(st._cx, st._cy, st._rMax + 8, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }

  // Shared values draw beneath the stars so their feeds never obscure a task.
  if (S.broadcasts.length) {
    const focusB = (selected && selected.type === 'broadcast' ? selected.id : null)
                || (hoveredBroadcast && hoveredBroadcast.id)
                || null;
    for (const b of S.broadcasts) drawBroadcast(b, tms, focusB);
  }

  for (const t of S.tasks) drawTask(t, now, tms, lod);
  for (const w of S.workers) drawWorker(w, tms);

  const focus = [];
  if (hovered) focus.push([hovered, .35]);
  if (selected) {
    const obj = selected.type === 'task' ? S.taskIx.get(selected.id) : S.workerIx.get(selected.id);
    if (obj) focus.push([obj, .8]);
  }
  for (const [obj, a] of focus) {
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.lineDashOffset = reduceMotion ? 0 : -(tms / 90) % 7;
    ctx.beginPath(); ctx.arc(obj._x, obj._y, 12, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  requestAnimationFrame(tick);
}
let rafRunning = false;
function tick(tms) {
  rafRunning = true;
  if (document.hidden) { rafRunning = false; return; }
  draw(tms);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !rafRunning) requestAnimationFrame(tick);
});
requestAnimationFrame(tick);

// ------------------------------------------------------------ interaction --
function hitTest(mx, my) {
  const wx = mx - camX, wy = my - camY;
  let best = null, bestD = 13 * 13;
  for (const t of S.tasks) {
    const d = (t._x - wx) ** 2 + (t._y - wy) ** 2;
    if (d < bestD) { bestD = d; best = { type: 'task', obj: t }; }
  }
  for (const w of S.workers) {
    const d = (w._x - wx) ** 2 + (w._y - wy) ** 2;
    if (d < bestD) { bestD = d; best = { type: 'worker', obj: w }; }
  }
  for (const b of S.broadcasts) {
    if (b._x === undefined) continue;
    const d = (b._x - wx) ** 2 + (b._y - wy) ** 2;
    if (d < bestD) { bestD = d; best = { type: 'broadcast', obj: b }; }
  }
  if (!best) {
    for (const r of labelRects) {
      if (wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h) {
        return { type: 'stage', obj: r.stage };
      }
    }
  }
  return best;
}

const tooltip = document.getElementById('tooltip');
canvas.addEventListener('mousemove', e => {
  const hit = hitTest(e.clientX, e.clientY);
  hovered = hit && (hit.type === 'task' || hit.type === 'worker') ? hit.obj : null;
  hoveredStage = hit && hit.type === 'stage' ? hit.obj : null;
  hoveredBroadcast = hit && hit.type === 'broadcast' ? hit.obj : null;
  canvas.style.cursor = hit ? 'pointer' : 'default';
  if (hit) {
    tooltip.style.display = 'block';
    const tipW = 260;
    const left = Math.min(e.clientX + 14, window.innerWidth - tipW);
    let top = e.clientY + 14;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    if (hit.type === 'task') {
      const t = hit.obj;
      tooltip.innerHTML = `<b>${esc(t.id)}</b><br>${esc(t.stage)} · ${statusLabel(t)}`;
    } else if (hit.type === 'worker') {
      const w = hit.obj;
      tooltip.innerHTML = `<b>executor ${esc(w.id)}</b><br>${w.current ? 'busy · ' + esc(w.current) : 'idle'}`;
    } else if (hit.type === 'broadcast') {
      const b = hit.obj;
      tooltip.innerHTML = `<b>shared value ${esc(b.id)}</b><br>` +
        `${fmtBytes(b.bytes)} · stored once · ${b.readers || 0} task${b.readers === 1 ? '' : 's'} read it`;
    } else {
      const st = hit.obj;
      tooltip.innerHTML = `<b>stage ${esc(st.id)}</b> · ${esc(st.kind || 'stage')}<br>click to inspect`;
    }
    // Clamp after content so we know the real height.
    const th = tooltip.offsetHeight || 40;
    if (top + th > window.innerHeight - 8) top = Math.max(8, e.clientY - th - 10);
    tooltip.style.top = top + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});
canvas.addEventListener('mouseleave', () => {
  hovered = null; hoveredStage = null; hoveredBroadcast = null;
  tooltip.style.display = 'none';
});
canvas.addEventListener('click', e => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit) { selected = { type: hit.type, id: hit.obj.id }; openPanel(); }
  else dropSelection();
});

function cycleSelection(list, type, dir) {
  if (!list.length) return;
  let idx = -1;
  if (selected && selected.type === type) {
    idx = list.findIndex(item => item.id === selected.id);
  }
  if (idx < 0) idx = dir > 0 ? -1 : 0;
  idx = (idx + dir + list.length) % list.length;
  selected = { type, id: list[idx].id };
  openPanel();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (summaryEl.classList.contains('open')) { closeSummary(); return; }
    dropSelection();
    canvas.focus({ preventScroll: true });
    return;
  }
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;

  if (e.key === 'ArrowRight' || e.key === 'j' || e.key === 'J') {
    e.preventDefault();
    cycleSelection(S.tasks, 'task', 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'k' || e.key === 'K') {
    e.preventDefault();
    cycleSelection(S.tasks, 'task', -1);
  } else if (e.key === ']' || e.key === '}') {
    e.preventDefault();
    cycleSelection(S.stages.filter(st => st._cx !== undefined), 'stage', 1);
  } else if (e.key === '[' || e.key === '{') {
    e.preventDefault();
    cycleSelection(S.stages.filter(st => st._cx !== undefined), 'stage', -1);
  } else if (e.key === 'e' || e.key === 'E') {
    e.preventDefault();
    cycleSelection(S.workers, 'worker', e.shiftKey ? -1 : 1);
  } else if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    const failed = S.tasks.filter(t => t.status === 'failed');
    if (failed.length) cycleSelection(failed, 'task', e.shiftKey ? -1 : 1);
  } else if (e.key === 'b' || e.key === 'B') {
    e.preventDefault();
    cycleSelection(S.broadcasts, 'broadcast', e.shiftKey ? -1 : 1);
  } else if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    if (!S.run.runId) return;
    if (summaryEl.classList.contains('open')) closeSummary(); else openSummary();
  }
});
document.getElementById('panelClose').addEventListener('click', () => {
  dropSelection();
  canvas.focus({ preventScroll: true });
});

// ----------------------------------------------------------------- panel ---
const panel = document.getElementById('panel');
function openPanel() {
  const wasOpen = panel.classList.contains('open');
  panel.classList.add('open');
  if (!wasOpen) {
    S.layoutDirty = true;
    queueMicrotask(() => document.getElementById('panelClose').focus({ preventScroll: true }));
  }
  renderPanel();
}
function closePanel() {
  if (!panel.classList.contains('open')) return;
  panel.classList.remove('open');
  S.layoutDirty = true;
}
function jumpBtn(type, id, label) {
  return `<button type="button" class="jump" data-jt="${esc(type)}" data-ji="${esc(id)}">${esc(label || id)}</button>`;
}
document.getElementById('panelBody').addEventListener('click', e => {
  const b = e.target.closest('[data-jt]');
  if (!b) return;
  selected = { type: b.dataset.jt, id: b.dataset.ji };
  openPanel();
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function statusLabel(t) {
  if (t.status === 'completed' && t.cacheHit) return '✧ cache replay';
  return { pending: '◌ queued', running: '◉ running', retrying: '↻ retrying',
           completed: '✦ completed', failed: '✕ failed' }[t.status] || t.status;
}
function statusColor(t) {
  if (t.status === 'completed' && t.cacheHit) return COLORS.cached;
  return { pending: COLORS.pending, running: COLORS.running, retrying: COLORS.retry,
           completed: COLORS.done, failed: COLORS.fail }[t.status] || COLORS.pending;
}
function fmtDur(ms) {
  if (ms == null || ms < 0) return '—';
  if (ms < 1000) return Math.round(ms) + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + 's';
  return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's';
}
function fmtTok(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k';
  return String(n);
}
function fmtBytes(n) {
  if (!n) return '0 B';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function fmtCost(c) {
  if (!c) return '$0';
  if (c < 0.0001) return '<$0.0001';
  return '$' + c.toFixed(c < 1 ? 4 : 2);
}
function relTime(at) {
  if (!S.run.startedAt) return '';
  return '+' + ((at - S.run.startedAt) / 1000).toFixed(2) + 's';
}

function pct(sorted, p) {
  if (!sorted.length) return null;
  return sorted[Math.floor(p * (sorted.length - 1))];
}

// The panel re-renders on a live tick; keep the user's <details> toggles and
// scroll position stable across re-renders of the same selection. Skip the
// DOM write when the HTML is unchanged so typing/scroll stays calm.
// ------------------------------------------------------- lazy task detail --
// Full prompts, responses, and record JSON are fetched per task, only when a
// node is actually opened. `rev` on the light node advances whenever that
// detail changes, which is how an open inspector notices its copy went stale
// without polling the payload itself.
const detailCache = new Map(); // taskId -> {rev, input, output, callLog, log}
const detailPending = new Set();
const MAX_CACHED_DETAILS = 40;

function taskDetail(t) {
  const have = detailCache.get(t.id);
  const rev = t.rev || 0;
  const stale = !have || have.rev !== rev;
  const nothingToFetch = !t.inBytes && !t.outBytes && !t.callN && !t.logN;

  if (stale && !nothingToFetch && !detailPending.has(t.id)) {
    detailPending.add(t.id);
    fetch('/api/task?id=' + encodeURIComponent(t.id))
      .then(r => (r.ok ? r.json() : null))
      .then(d => {
        if (!d) return;
        detailCache.set(d.id, {
          rev: d.rev || 0, input: d.input || '', output: d.output || '',
          callLog: d.callLog || [], log: d.log || [],
        });
        // Bound the client cache too: a long run must not accumulate every
        // node's prompts in the tab it was meant to keep responsive.
        while (detailCache.size > MAX_CACHED_DETAILS) {
          detailCache.delete(detailCache.keys().next().value);
        }
        panelDirty = true;
      })
      .catch(() => {})
      .finally(() => detailPending.delete(t.id));
  }
  // A stale copy beats a blank panel while the refresh is in flight.
  return have || null;
}

function setPanelHTML(body, html) {
  const key = selected ? selected.type + ':' + selected.id : '';
  const same = key === lastPanelKey;
  if (same && html === lastPanelHTML) return;
  const prevOpen = same ? [...body.querySelectorAll('details')].map(d => d.open) : null;
  const prevScroll = same ? body.scrollTop : 0;
  body.innerHTML = html;
  lastPanelHTML = html;
  if (prevOpen) {
    const cur = [...body.querySelectorAll('details')];
    if (cur.length === prevOpen.length) cur.forEach((d, i) => { d.open = prevOpen[i]; });
    body.scrollTop = prevScroll;
  }
  lastPanelKey = key;
}

function renderPanel() {
  if (!selected) return;
  const title = document.getElementById('panelTitle');
  const body = document.getElementById('panelBody');

  if (selected.type === 'worker') {
    const w = S.workerIx.get(selected.id);
    if (!w) return;
    title.textContent = 'executor ' + w.id;
    const cur = w.current ? jumpBtn('task', w.current)
      : '<span style="color:var(--ink-3)">idle</span>';
    setPanelHTML(body, `
      <span class="status-chip" style="color:${w.current ? COLORS.running : 'var(--ink-3)'}">
        ${w.current ? '◆ busy' : '◇ idle'}</span>
      <dl class="kv">
        <dt>current task</dt><dd class="mono">${cur}</dd>
        <dt>completed</dt><dd>${w.done}</dd>
        <dt>failed</dt><dd>${w.failed}</dd>
        <dt>busy time</dt><dd>${fmtDur(w.busyMs)}</dd>
      </dl>`);
    return;
  }

  if (selected.type === 'stage') { renderStagePanel(title, body); return; }
  if (selected.type === 'broadcast') { renderBroadcastPanel(title, body); return; }

  const t = S.taskIx.get(selected.id);
  if (!t) return;
  title.textContent = t.id;
  const now = serverNow();
  const runtime = t.startedAt ? (t.endedAt || now) - t.startedAt : null;
  const rows = [
    ['stage', jumpBtn('stage', t.stage)],
    ['executor', t.worker ? jumpBtn('worker', t.worker) : '—'],
    ['model', t.model ? `<span class="mono">${esc(t.model)}</span>` : '—'],
    ['attempts', `${t.attempts || 0}${t.retries ? ` <span style="color:${COLORS.retry}">(${t.retries} ${t.retries === 1 ? 'retry' : 'retries'})</span>` : ''}`],
    ['records in', String(t.records || 0)],
    ['records out', t.outputIds ? String(t.outputIds.length) : '—'],
    ['runtime', (t.endedAt ? '' : '⏱ ') + fmtDur(runtime)],
    ['last latency', t.latencyMs ? fmtDur(t.latencyMs) : '—'],
    ['model calls', String(t.calls || 0)],
    ['tokens in / out', `${fmtTok((t.usage && t.usage.in) || 0)} / ${fmtTok((t.usage && t.usage.out) || 0)}`],
    ['cost', fmtCost((t.usage && t.usage.cost) || 0)],
    ['cache', t.cacheHit ? '⚡ replayed from cache' : 'no'],
  ];
  if (t.usage && t.usage.cached) {
    rows.push(['shared prefix',
      `${fmtTok(t.usage.cached)} tokens served from the stage's cached prompt head`]);
  }
  if ((t.broadcasts || []).length) {
    rows.push(['shared values', t.broadcasts.map(n => jumpBtn('broadcast', n)).join(' ')]);
  }
  let html = `<span class="status-chip" style="color:${statusColor(t)};border-color:${statusColor(t)}55">${statusLabel(t)}</span>`;
  html += '<dl class="kv">' + rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') + '</dl>';

  // lineage: what merged into this node, and where its output went
  const lin = lineageOf(t.id);
  html += `<h4>merged from</h4><div class="lineage">` +
    (lin.from.length
      ? lin.from.map(pid => {
          const p = S.taskIx.get(pid);
          return jumpBtn('task', pid, `${pid}${p ? ' · ' + p.stage : ''}`);
        }).join('')
      : `<span class="none">${(t.inputIds || []).length ? 'pipeline source records — no upstream task' : 'no input records'}</span>`) +
    '</div>';
  html += `<h4>feeds into</h4><div class="lineage">` +
    (lin.to.length
      ? lin.to.map(cid => {
          const c = S.taskIx.get(cid);
          return jumpBtn('task', cid, `${cid}${c ? ' · ' + c.stage : ''}`);
        }).join('')
      : `<span class="none">${t.status === 'completed' ? 'not consumed downstream (yet)' : 'no output yet'}</span>`) +
    '</div>';

  // Everything below is the heavy half of the node, fetched on demand for
  // the one task being inspected rather than shipped for every task in the
  // run. Until it lands, the headers still say what is there.
  const det = taskDetail(t);
  const loading = `<div class="none">loading…</div>`;

  if (t.inBytes) {
    html += `<h4>input · ${t.records || 0} record${t.records === 1 ? '' : 's'} · ${fmtBytes(t.inBytes)}</h4>`;
    html += det
      ? `<details open><summary>${esc(summarizeIDs(t.inputIds))}</summary><pre>${esc(det.input)}</pre></details>`
      : loading;
  }
  if (t.outBytes) {
    const n = (t.outputIds || []).length;
    html += `<h4>output · ${n} record${n === 1 ? '' : 's'} · ${fmtBytes(t.outBytes)}</h4>`;
    html += det
      ? `<details open><summary>${esc(summarizeIDs(t.outputIds))}</summary><pre>${esc(det.output)}</pre></details>`
      : loading;
  }

  const calls = (det && det.callLog) || [];
  if (!det && t.callN) {
    html += `<h4>model calls · ${t.callN}</h4>${loading}`;
  }
  if (calls.length) {
    html += `<h4>model calls · ${calls.length}</h4>`;
    calls.forEach((c, i) => {
      const ok = !c.err;
      const label = `#${i + 1} · ${esc(c.model || '—')} · ${fmtDur(c.latencyMs)}` +
        (ok ? ` · ${fmtTok(c.in)}→${fmtTok(c.out)} tok · ${fmtCost(c.cost)}` : ' · ✕ failed');
      const open = calls.length === 1 || i === calls.length - 1 ? ' open' : '';
      html += `<details${open}><summary style="${ok ? '' : `color:${COLORS.retry}`}">${label}</summary><div class="call-body">` +
        (c.prompt ? `<div class="cl">request</div><pre>${esc(c.prompt)}</pre>` : '') +
        (ok
          ? (c.response ? `<div class="cl">response</div><pre>${esc(c.response)}</pre>` : '')
          : `<div class="cl">error</div><pre class="err">${esc(c.err)}</pre>`) +
        '</div></details>';
    });
  }

  if (t.error) html += `<h4>error</h4><pre class="err">${esc(t.error)}</pre>`;
  const log = (det && det.log) || [];
  html += `<h4>log · ${det ? log.length : (t.logN || 0)} events</h4>`;
  html += det
    ? `<ul class="log">` +
      log.map(l => `<li><span class="t">${relTime(l.at)}</span><span>${esc(l.msg)}</span></li>`).join('') +
      '</ul>'
    : loading;
  setPanelHTML(body, html);
}

// The shared-value inspector answers both halves of the question: *what* was
// shared (name, content hash, size, the value itself) and *where* it went
// (which stages declared it, which tasks actually read it).
function renderBroadcastPanel(title, body) {
  const b = S.broadcastIx.get(selected.id);
  if (!b) return;
  title.textContent = 'shared value ' + b.id;

  const stages = b.stages || [];
  const tasks = b.tasks || [];
  const copiesSaved = b.readers > 1 ? fmtBytes(b.bytes * (b.readers - 1)) : null;

  const rows = [
    ['content hash', b.hash ? `<span class="mono">${esc(b.hash.slice(0, 16))}…</span>` : '—'],
    ['size', fmtBytes(b.bytes)],
    ['stored', '1 copy for the whole run'],
    ['tasks that read it', String(b.readers || 0)],
  ];
  if (copiesSaved) rows.push(['payload avoided', `${copiesSaved} not copied into task envelopes`]);

  let html = `<span class="status-chip" style="color:${COLORS.shared};border-color:${COLORS.shared}55">◇ shared value</span>`;
  html += '<dl class="kv">' + rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') + '</dl>';

  html += `<h4>read by stages</h4><div class="lineage">` +
    (stages.length
      ? stages.map(sid => jumpBtn('stage', sid)).join('')
      : `<span class="none">registered for the run, not yet read</span>`) +
    '</div>';

  html += `<h4>read by tasks · ${b.readers || 0}</h4><div class="lineage">` +
    (tasks.length
      ? tasks.map(tid => {
          const t = S.taskIx.get(tid);
          return jumpBtn('task', tid, `${tid}${t ? ' · ' + t.stage : ''}`);
        }).join('') + (b.readers > tasks.length
          ? `<span class="none">+${b.readers - tasks.length} more</span>` : '')
      : `<span class="none">no reads yet</span>`) +
    '</div>';

  if (b.preview) {
    html += `<h4>value</h4><details open><summary>${esc(fmtBytes(b.bytes))} of JSON` +
      `</summary><pre>${esc(b.preview)}</pre></details>`;
  }
  html += `<h4>why this is a broadcast</h4><div class="lineage"><span class="none">` +
    `registered once per run and referenced by content hash — task envelopes carry the ` +
    `hash, not the bytes, so every reader shares one copy and tasks stay small enough ` +
    `to ship to a remote executor</span></div>`;
  setPanelHTML(body, html);
}

function summarizeIDs(ids) {
  if (!ids || !ids.length) return 'records';
  const shown = ids.slice(0, 6).join(', ');
  return ids.length > 6 ? `${shown}, +${ids.length - 6} more` : shown;
}

function renderStagePanel(title, body) {
  const st = S.stageIx.get(selected.id);
  if (!st) return;
  title.textContent = 'stage ' + st.id;
  const now = serverNow();

  let total = 0, done = 0, failed = 0, active = 0, queued = 0,
      retries = 0, cache = 0, calls = 0, tokIn = 0, tokOut = 0, cost = 0,
      recIn = 0, recOut = 0;
  const durations = [];
  const failedTasks = [];
  for (const t of S.tasks) {
    if (t.stage !== st.id) continue;
    total++;
    if (t.status === 'completed') {
      done++;
      if (t.startedAt && t.endedAt) durations.push(t.endedAt - t.startedAt);
    } else if (t.status === 'failed') { failed++; failedTasks.push(t.id); }
    else if (t.status === 'running' || t.status === 'retrying') active++;
    else queued++;
    retries += t.retries || 0;
    if (t.cacheHit) cache++;
    calls += t.calls || 0;
    tokIn += (t.usage && t.usage.in) || 0; tokOut += (t.usage && t.usage.out) || 0; cost += (t.usage && t.usage.cost) || 0;
    recIn += t.records || 0; recOut += (t.outputIds || []).length;
  }
  durations.sort((a, b) => a - b);
  const dur = st.startedAt ? (st.endedAt || now) - st.startedAt : null;
  const statusTxt = st.status === 'done' ? '✦ done' : '◉ running';

  const rows = [
    ['kind', esc(st.kind || '—')],
    ['upstream', st.upstream ? jumpBtn('stage', st.upstream) : '— (pipeline root)'],
    ['duration', (st.endedAt ? '' : '⏱ ') + fmtDur(dur)],
    ['tasks', `${total} · ${done} done, ${failed} failed, ${active} active, ${queued} queued`],
    ['records in / out', `${recIn} / ${recOut}`],
    ['retries', String(retries)],
    ['cache hits', String(cache)],
    ['model calls', String(calls)],
    ['tokens in / out', `${fmtTok(tokIn)} / ${fmtTok(tokOut)}`],
    ['cost', fmtCost(cost)],
    ['task p50 / p95', durations.length ? `${fmtDur(pct(durations, .5))} / ${fmtDur(pct(durations, .95))}` : '—'],
  ];
  // The shared prompt prefix is a stage-level property — every task in the
  // stage sends the same head — so its economics belong here, next to the
  // stage's own tokens and cost.
  if (st.cachedTokens || st.writtenTokens) {
    const served = st.cachedTokens || 0, written = st.writtenTokens || 0;
    const share = (served + written) ? Math.round(100 * served / (served + written + tokIn)) : 0;
    rows.push(['shared prefix',
      `${fmtTok(served)} tokens served from cache · ${fmtTok(written)} written`]);
    rows.push(['prefix saving',
      `${st.savedUsd >= 0 ? '' : '−'}$${Math.abs(st.savedUsd || 0).toFixed(5)}` +
      (st.savedUsd < 0 ? ' <span class="none">(entry not yet reused)</span>'
                       : ` <span class="none">(${share}% of prompt tokens)</span>`)]);
  }
  const reads = S.broadcasts.filter(b => (b.stages || []).includes(st.id));
  if (reads.length) {
    rows.push(['shared values', reads.map(b => jumpBtn('broadcast', b.id)).join(' ')]);
  }
  let html = `<span class="status-chip" style="color:${st.status === 'done' ? COLORS.done : COLORS.running}">${statusTxt}</span>`;
  html += '<dl class="kv">' + rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') + '</dl>';
  if (st.detail) html += `<h4>what this stage does</h4><pre>${esc(st.detail)}</pre>`;
  if (failedTasks.length) {
    html += `<h4>failed tasks</h4><div class="lineage">` +
      failedTasks.slice(0, 8).map(id => jumpBtn('task', id)).join('') +
      (failedTasks.length > 8 ? `<span class="none">+${failedTasks.length - 8} more</span>` : '') +
      '</div>';
  }
  html += `<h4>tip</h4><div class="lineage"><span class="none">click any star for its full detail; selecting a star draws what merged into it</span></div>`;
  setPanelHTML(body, html);
}

// --------------------------------------------------------- run summary ----
// One card that tells the whole run's story: the steps in pipeline order,
// what the shared values saved by being referenced instead of copied, and
// how the executor pool spread the work.
const summaryEl = document.getElementById('summary');
const summaryBody = document.getElementById('summaryBody');
let summaryTimer = 0;

function openSummary() {
  renderSummary();
  summaryEl.classList.add('open');
  queueMicrotask(() => document.getElementById('summaryClose').focus({ preventScroll: true }));
}
function closeSummary() {
  clearTimeout(summaryTimer);
  summaryEl.classList.remove('open');
}
function scheduleAutoSummary() {
  clearTimeout(summaryTimer);
  summaryTimer = setTimeout(openSummary, 1400); // let the finale flash land first
}

function aggStage(id) {
  const a = { total: 0, done: 0, failed: 0, cache: 0, retries: 0,
              recIn: 0, recOut: 0, tokIn: 0, tokOut: 0, cost: 0, durs: [] };
  for (const t of S.tasks) {
    if (t.stage !== id) continue;
    a.total++;
    if (t.status === 'completed') {
      a.done++;
      if (t.startedAt && t.endedAt) a.durs.push(t.endedAt - t.startedAt);
    } else if (t.status === 'failed') a.failed++;
    a.retries += t.retries || 0;
    if (t.cacheHit) a.cache++;
    a.recIn += t.records || 0; a.recOut += (t.outputIds || []).length;
    a.tokIn += (t.usage && t.usage.in) || 0; a.tokOut += (t.usage && t.usage.out) || 0;
    a.cost += (t.usage && t.usage.cost) || 0;
  }
  a.durs.sort((x, y) => x - y);
  return a;
}

function renderSummary() {
  document.getElementById('summaryRun').textContent =
    S.run.runId + (S.run.done ? '' : ' · still running');

  let done = 0, retries = 0, cache = 0, tok = 0, cost = 0;
  for (const t of S.tasks) {
    if (t.status === 'completed') done++;
    retries += t.retries || 0;
    if (t.cacheHit) cache++;
    tok += ((t.usage && t.usage.in) || 0) + ((t.usage && t.usage.out) || 0);
    cost += (t.usage && t.usage.cost) || 0;
  }
  let prefixServed = 0, prefixWritten = 0, prefixSaved = 0;
  for (const st of S.stages) {
    prefixServed += st.cachedTokens || 0;
    prefixWritten += st.writtenTokens || 0;
    prefixSaved += st.savedUsd || 0;
  }
  const elapsed = S.run.startedAt ? (S.run.endedAt || serverNow()) - S.run.startedAt : null;
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  let html = '<div class="totals">' +
    stat(elapsed != null ? fmtDur(elapsed) : '—', 'elapsed') +
    stat(`${done}/${S.tasks.length}`, 'tasks done') +
    stat(String(cache), 'cache replays') +
    stat(String(retries), 'retries') +
    stat(fmtTok(tok), 'tokens') +
    (prefixServed ? stat(fmtTok(prefixServed), 'prefix served') : '') +
    stat(fmtCost(cost), 'cost') +
    '</div>';

  // Steps, in the order the driver started them (topological).
  html += '<h4>steps</h4><table><tr><th>stage</th><th>kind</th><th>tasks</th>' +
    '<th>records</th><th>retries</th><th>cached</th><th>tokens</th><th>cost</th><th>p95</th></tr>';
  for (const st of S.stages) {
    const a = aggStage(st.id);
    const tasksTxt = a.total
      ? `${a.done}/${a.total}` + (a.failed ? ` <span style="color:${COLORS.fail}">✕${a.failed}</span>` : '')
      : '<span style="color:var(--ink-3)">driver</span>';
    html += `<tr><td>${jumpBtn('stage', st.id)}</td>` +
      `<td>${esc(st.kind || '—')}</td>` +
      `<td>${tasksTxt}</td>` +
      `<td>${a.total ? `${a.recIn}→${a.recOut}` : '—'}</td>` +
      `<td>${a.retries || (a.total ? '0' : '—')}</td>` +
      `<td>${a.total ? (a.cache ? `<span class="save">✧ ${a.cache}</span>` : '0') : '—'}</td>` +
      `<td>${a.tokIn + a.tokOut ? fmtTok(a.tokIn + a.tokOut) : '—'}</td>` +
      `<td>${a.cost ? fmtCost(a.cost) : '—'}</td>` +
      `<td>${a.durs.length ? fmtDur(pct(a.durs, .95)) : '—'}</td></tr>`;
  }
  html += '</table>';

  if (prefixServed || prefixWritten) {
    html += `<div class="note">shared prompt prefixes: ` +
      `<span class="save">${fmtTok(prefixServed)}</span> prompt tokens were served from the ` +
      `providers' caches instead of being reprocessed, against ${fmtTok(prefixWritten)} spent ` +
      `establishing those entries` +
      (prefixSaved > 0
        ? ` — <span class="save">${fmtCost(prefixSaved)}</span> saved against paying the full input rate.`
        : `. The entries have not been reused enough to pay for themselves yet.`) +
      ` A stage's prefix is cached only when it issues more than one call.</div>`;
  }

  if (S.broadcasts.length) {
    html += '<h4>shared values · stored once, referenced by hash</h4>' +
      '<table><tr><th>value</th><th>size</th><th>read by tasks</th><th>stages</th>' +
      '<th>if copied per task</th><th>payload avoided</th></tr>';
    let avoided = 0;
    for (const b of S.broadcasts) {
      const readers = b.readers || 0;
      const copied = b.bytes * readers;
      const saved = readers > 1 ? b.bytes * (readers - 1) : 0;
      avoided += saved;
      html += `<tr><td>${jumpBtn('broadcast', b.id)}</td>` +
        `<td>${fmtBytes(b.bytes)}</td>` +
        `<td>${readers}</td>` +
        `<td>${(b.stages || []).length}</td>` +
        `<td>${readers ? fmtBytes(copied) : '—'}</td>` +
        `<td>${saved ? `<span class="save">${fmtBytes(saved)}</span>` : '—'}</td></tr>`;
    }
    html += '</table>';
    html += `<div class="note">task envelopes carry a 64-byte content hash instead of the value` +
      (avoided ? `, so <span class="save">${fmtBytes(avoided)}</span> of shared payload never left the store` : '') +
      `; each value's hash is part of its readers' cache fingerprints — edit one and exactly those results recompute.</div>`;
  }

  if (S.workers.length) {
    html += '<h4>executors</h4><table><tr><th>executor</th><th>tasks done</th>' +
      '<th>failed</th><th>busy</th><th>utilization</th></tr>';
    let totalDone = 0;
    for (const w of S.workers) {
      totalDone += w.done || 0;
      const util = elapsed ? Math.min(100, Math.round(100 * (w.busyMs || 0) / elapsed)) : null;
      html += `<tr><td>${jumpBtn('worker', w.id)}</td>` +
        `<td>${w.done || 0}</td><td>${w.failed || 0}</td>` +
        `<td>${fmtDur(w.busyMs || 0)}</td>` +
        `<td>${util != null ? util + '%' : '—'}</td></tr>`;
    }
    html += '</table>';
    html += `<div class="note">${S.workers.length} executors ran ${totalDone} tasks — ` +
      `~${(totalDone / S.workers.length).toFixed(1)} each, every task under its own ` +
      `least-privilege envelope (model, secrets, broadcasts, egress, budget).</div>`;
  }

  summaryBody.innerHTML = html;
}

document.getElementById('summaryClose').addEventListener('click', closeSummary);
summaryEl.addEventListener('click', e => { if (e.target === summaryEl) closeSummary(); });
summaryBody.addEventListener('click', e => {
  const b = e.target.closest('[data-jt]');
  if (!b) return;
  closeSummary();
  selected = { type: b.dataset.jt, id: b.dataset.ji };
  openPanel();
});
document.getElementById('runMeta').addEventListener('click', e => {
  if (e.target.closest('[data-summary]')) openSummary();
});

// -------------------------------------------------------- header / stats ---
function refreshChrome() {
  const empty = document.getElementById('empty');
  if (!S.run.runId) {
    empty.style.display = 'flex';
    const emptyHTML = connState === 'reconnecting'
      ? `<h2>Reconnecting to the event stream…</h2><code>the constellation will resume automatically</code>`
      : `<h2>Listening for a Loom run</h2><code>loom.Run(ctx, p, loom.WithEventHandler(viz.Handle), …)</code>`;
    if (empty.dataset.html !== emptyHTML) {
      empty.innerHTML = emptyHTML;
      empty.dataset.html = emptyHTML;
    }
  } else {
    empty.style.display = 'none';
  }

  const meta = document.getElementById('runMeta');
  const connCls = connState === 'live' ? 'ok' : (connState === 'reconnecting' ? 'warn' : '');
  const connLabel = connState === 'live' ? 'stream live' : (connState === 'reconnecting' ? 'reconnecting…' : 'connecting…');
  const connChip = `<span class="chip conn ${connCls}" title="event stream">${connLabel}</span>`;
  let metaHTML;
  if (!S.run.runId) {
    metaHTML = `waiting for a run…${connChip}`;
  } else {
    const state = S.run.done
      ? `<span class="chip done">✦ complete</span>`
      : `<span class="chip live">◉ live</span>`;
    const note = S.run.note ? `<span class="chip note">⚠ ${esc(S.run.note)}</span>` : '';
    const sumBtn = `<button type="button" class="chip btn" data-summary title="run summary (s)">☰ summary</button>`;
    // Which driver ran is part of reading the picture: under streaming the
    // stages overlap and the executors are shared engine slots.
    const drv = S.run.driver === 'streaming'
      ? `<span class="chip" title="pipelined execution — stages overlap, executors are shared engine slots">⇄ streaming</span>`
      : (S.run.driver === 'barrier'
          ? `<span class="chip" title="one stage at a time">▮ barrier</span>` : '');
    metaHTML = `<span style="font-family:ui-monospace,Menlo,monospace">${esc(S.run.runId)}</span>${state}${drv}${note}${sumBtn}${connChip}`;
  }
  if (meta.dataset.html !== metaHTML) {
    meta.innerHTML = metaHTML;
    meta.dataset.html = metaHTML;
  }

  let done = 0, failed = 0, running = 0, retries = 0, cache = 0, tok = 0, cost = 0;
  for (const t of S.tasks) {
    if (t.status === 'completed') done++;
    else if (t.status === 'failed') failed++;
    else if (t.status === 'running' || t.status === 'retrying') running++;
    retries += t.retries || 0;
    if (t.cacheHit) cache++;
    tok += ((t.usage && t.usage.in) || 0) + ((t.usage && t.usage.out) || 0);
    cost += (t.usage && t.usage.cost) || 0;
  }
  const elapsed = S.run.startedAt ? (S.run.endedAt || serverNow()) - S.run.startedAt : null;
  const stat = (v, l, cls) => `<div class="stat"><b${cls ? ` class="${cls}"` : ''}>${v}</b><span>${l}</span></div>`;
  const statsHTML =
    stat(elapsed != null ? fmtDur(elapsed) : '—', 'elapsed') +
    stat(`${done}/${S.tasks.length}`, 'tasks') +
    stat(String(running), 'active') +
    stat(failed ? `<span class="accent-fail">${failed}</span>` : '0', 'failed') +
    stat(String(retries), 'retries') +
    stat(String(cache), 'cached') +
    stat(fmtTok(tok), 'tokens') +
    stat(fmtCost(cost), 'cost') +
    (S.broadcasts.length ? stat(String(S.broadcasts.length), 'shared') : '');
  const statsEl = document.getElementById('stats');
  if (statsEl.dataset.html !== statsHTML) {
    statsEl.innerHTML = statsHTML;
    statsEl.dataset.html = statsHTML;
  }
}

// The display tick: one coalesced rebuild of the DOM chrome per interval,
// however many events arrived in between. It also keeps elapsed/runtime
// counters moving while things are in flight, so it runs even when nothing
// changed — but only while a run is live.
setInterval(() => {
  const live = S.run.runId && !S.run.done;
  if (chromeDirty || live) {
    chromeDirty = false;
    refreshChrome();
  }
  if ((panelDirty || live) && selected && panel.classList.contains('open')) {
    panelDirty = false;
    renderPanel();
  }
  if (summaryEl.classList.contains('open')) renderSummary();
}, 400);
refreshChrome();
</script>
</body>
</html>
